[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[lib]
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace", "objc2-core-foundation"] }
objc2-foundation = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
window-vibrancy = "0.8"
